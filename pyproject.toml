[project]
name = "gem-in-game"
version = "0.1.0"
description = "Local computer-vision pipeline that turns an amateur basketball game video into a tactical scouting report"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "edge-tts>=7.3.1",
    "huggingface-hub>=2.2.0",
    "markdown-it-py>=4.2.0",
    "matplotlib>=3.11.2",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.6",
    "protobuf>=7.36.2",
    "rfdetr>=1.11.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "sentencepiece>=0.2.2",
    "supervision>=0.30.9",
    "torch>=2.5",
    "torchvision>=0.20",
    "tqdm>=4.70.1",
    "trackers>=2.6.1",
    "transformers>=5.19.0",
    "ultralytics>=8.4.177",
    "umap-learn>=0.5.12",
]

[project.scripts]
gem-in-game = "gem_in_game.cli:main"

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
torchvision = [{ index = "pytorch-cu124" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
